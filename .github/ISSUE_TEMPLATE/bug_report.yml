name: Bug report
description: Something in Eight+ doesn't work as described
labels: [bug]
body:
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Eight Sleep cloud (eight_sleep), free-sleep (hass-free-sleep), Eight+ Pod gateway]
    validations: {required: true}
  - type: dropdown
    id: part
    attributes:
      label: Which part
      multiple: true
      options: [Card, Home Assistant app / setup, Autopilot or schedules, Sleep reports, Pod app, Pod gateway, iOS app]
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pod model, Home Assistant version, Eight+ app version, card version
      placeholder: Pod 3, HA 2026.11.2, Eight+ 0.1.2, card v10.43
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The Eight+ app log (Settings → Apps → Eight+ → Log) and any browser console errors. Remove anything private.
      render: text
