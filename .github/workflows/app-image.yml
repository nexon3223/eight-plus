name: app-image
# Builds the Home Assistant app once per version and publishes it to ghcr.io, so Home Assistant downloads a
# ready-made image (seconds) instead of building the Dockerfile on every user's machine (minutes).
#   ghcr.io/nexon3223/aarch64-eight-plus:<version>   (Raspberry Pi, other ARM)
#   ghcr.io/nexon3223/amd64-eight-plus:<version>     (Intel/AMD)
# <version> is eight_plus/config.yaml's version. It runs whenever the app changes on main, so a version bump is
# published a couple of minutes after it merges.
on:
  push:
    branches: [main]
    paths: ["eight_plus/**", ".github/workflows/app-image.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (default: main)"
        required: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: read version and base image
        id: meta
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          v="$(grep '^version:' eight_plus/config.yaml | tr -d '" ' | cut -d: -f2)"
          from="$(grep "^  ${ARCH}:" eight_plus/build.yaml | awk '{print $2}')"
          test -n "$v" && test -n "$from"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: eight_plus
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.meta.outputs.from }}
          push: true
          provenance: false
          tags: |
            ghcr.io/nexon3223/${{ matrix.arch }}-eight-plus:${{ steps.meta.outputs.version }}
            ghcr.io/nexon3223/${{ matrix.arch }}-eight-plus:latest
          labels: |
            io.hass.type=addon
            io.hass.name=Eight+
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/nexon3223/eight-plus
            org.opencontainers.image.title=Eight+
            org.opencontainers.image.licenses=MIT
