name: release
# Attaches the Pod gateway to every published release as eight-plus-gateway.tar.gz, so the gateway install
# can download it straight onto the Pod (releases/latest/download/eight-plus-gateway.tar.gz).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the gateway to (e.g. v0.1.2)"
        required: true
permissions:
  contents: write
jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: package the gateway
        run: |
          git archive --format=tar.gz -o eight-plus-gateway.tar.gz HEAD gateway
          tar tzf eight-plus-gateway.tar.gz | grep -qx 'gateway/install.sh'
      - name: attach to the release
        run: gh release upload "$TAG" eight-plus-gateway.tar.gz --clobber
