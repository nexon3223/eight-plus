name: Eight+
version: "0.1.0"
slug: eight_plus
description: >-
  Guided setup for the Eight+ card — Autopilot, schedules, sleep reports, a bedtime coach
  and a no-login Pod app — for Eight Sleep Pods on the cloud, free-sleep or the Eight+ gateway.
url: https://github.com/nexon3223/eight-plus
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:bed-king-outline
panel_title: Eight+
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: false
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Pod app for phones on your network (only answers once switched on in the Eight+ panel)
options:
  backfill_days: 10
schema:
  backfill_days: int(0,30)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
