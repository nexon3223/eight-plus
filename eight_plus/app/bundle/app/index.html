<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pod</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- iOS standalone webapp -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pod" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-8plus.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-8plus.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512-8plus.png" />
  <style>
    :root {
      color-scheme: dark;
      /* how much vertical space THIS page's own chrome (body padding + safe-area insets, set
         below) takes around the card — the card's v2 app-shell subtracts this via
         --v2-outer-chrome so its 100dvh math is exact, not approximate. Custom properties
         cross into the card's shadow DOM, so nothing there needs to know this page exists. */
      --v2-outer-chrome: calc(max(8px, env(safe-area-inset-top)) + 10px + env(safe-area-inset-bottom));
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; color: #eef1f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;              /* no rubber-band / pull-to-refresh */
      overflow-x: hidden;                     /* never scroll sideways */
      scrollbar-width: none;                  /* Firefox */
      -ms-overflow-style: none;
    }
    /* hide the scrollbar chrome (home-screen standalone) — vertical scroll still works */
    html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: max(8px, env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    #app { width: 100%; max-width: 480px; margin: 0 auto; }
    /* connection banner */
    #conn {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      background: rgba(255,90,82,.16); color: #ff9a94;
      border: 1px solid rgba(255,90,82,.35);
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9999;
    }
    #conn.show { opacity: 1; }
    /* cold-start "Connecting…" over cached data: neutral, not the red dropped-connection look */
    #conn.soft { background: rgba(255,255,255,.08); color: #b8bfcc; border-color: rgba(255,255,255,.14); }
    /* first-paint splash: the 8+ mark while we connect */
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; z-index: 9998; transition: opacity .5s;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 128px; height: 128px; animation: es-breathe 2s ease-in-out infinite; }
    @keyframes es-breathe { 0%,100%{opacity:.7; transform:scale(.98)} 50%{opacity:1; transform:scale(1)} }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="conn">Reconnecting…</div>
  <div id="splash">
    <img src="/icons/icon-512-8plus.png" alt="Pod" />
  </div>
  <script src="/config.js"></script>
  <script type="module" src="/eight-sleep-card.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
